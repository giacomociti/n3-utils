<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARQL Builtin Playground</title>
</head>
<body>
  <h1>SPARQL Builtin Playground</h1>
  <textarea id="rules" rows="20" cols="60">
@prefix wd: <http://www.wikidata.org/entity/> .
@prefix wdt: <http://www.wikidata.org/prop/direct/> .
@prefix sparql: <https://raw.githubusercontent.com/giacomociti/n3-utils/refs/heads/main/builtins/sparql.js#> .

{
    <https://qlever.dev/api/wikidata> sparql:query {
        wd:Q12418 wdt:P170 ?author .
        ?author wdt:P1477 ?name .
    } .
}
=>
{
    wd:Q12418 wdt:P170 ?author .
    ?author wdt:P1477 ?name .
} .
  </textarea>
  <button id="run">Run</button>
  <pre id="output"></pre>

  <script>
    let worker;
    let lastRequestId = 0;

    const getWorker = () => {
      if (!worker) {
        worker = new Worker('./sparql-playground-worker.js');
      }
      return worker;
    };

    document.getElementById('run').addEventListener('click', () => {
      const rules = document.getElementById('rules').value;
      const output = document.getElementById('output');
      output.textContent = 'Running...';
      lastRequestId += 1;
      const requestId = lastRequestId;

      try {
        const reasoningWorker = getWorker();

        reasoningWorker.onmessage = (event) => {
          const data = event.data || {};
          if (data.requestId !== requestId) {
            return;
          }

          output.textContent = data.ok ? data.closureN3 : (data.error || 'Unknown worker error');
        };

        reasoningWorker.onerror = (event) => {
          output.textContent = event.message || 'Worker failed to execute';
        };

        reasoningWorker.postMessage({ requestId, rules });
      } catch (err) {
        output.textContent = (err && err.stack) ? err.stack : String(err);
      }
    });
  </script>
</body>
</html>
